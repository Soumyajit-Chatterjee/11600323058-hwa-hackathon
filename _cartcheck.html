<!DOCTYPE html>
<html lang="en">
<body style="margin:0;background:#fff">
  <iframe id="frame" style="display:block;width:100%;height:1300px;border:0" title="cart preview"></iframe>
  <script>
    const act = new URLSearchParams(location.search).get('act') === '1';
    const items = [
      { id: 'starter-Small / Medium', productId: 'starter', name: 'Starter Kit', price: 3499, salePrice: 2399, variant: 'Small / Medium', qty: 1 },
      { id: 'refill-One size', productId: 'refill', name: 'Scent Refill Pack', price: 999, salePrice: 599, variant: 'One size', qty: 2 }
    ];
    localStorage.setItem('chronoscent_cart', JSON.stringify(items));

    const frame = document.getElementById('frame');
    frame.src = '/#/cart';

    if (act) {
      frame.addEventListener('load', () => {
        setTimeout(() => {
          const d = frame.contentDocument;
          d.querySelector('.qty--plus')?.click();
          setTimeout(() => d.querySelector('.qty--plus')?.click(), 150);
          setTimeout(() => d.querySelector('.qty--minus')?.click(), 300);
        }, 900);
      });
    }
  </script>
</body>
</html>
